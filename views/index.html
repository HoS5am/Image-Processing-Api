<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Resizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
        <button id="theme-toggle">🌙 Dark Mode</button>
        <h1>Image Resizer</h1>
        <p>Resize and preview your images instantly!</p>
    </div>
  </header>

  <main class="container">
    <form id="resize-form">
        <label>Select an image:</label>
        <div id="thumbnail-container" class="thumbnail-grid"></div>
        <input type="hidden" id="filename" name="filename" />
        <label for="width">Width (px):</label>
        <input type="number" id="width" name="width" placeholder="e.g. 300" required />

        <label for="height">Height (px):</label>
        <input type="number" id="height" name="height" placeholder="e.g. 200" required />

        <button type="submit">Generate Image</button>
    </form>

    <section id="result">
      <h2>Preview:</h2>
      <div id="image-container"></div>
      <div id="image-link">
        <span id="image-url-text"></span>
        <button id="copy-link-btn">Copy Link</button>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Hossam Mohamed. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
